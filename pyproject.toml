[project]
name = "agenthost"
version = "0.1.0"
description = "A minimal, modular agent host: folder-based agents with tools, skills, and memory."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "ddgs>=9.0",
    "pykeepass>=4.1.0",
]

[project.scripts]
agenthost = "agenthost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthost"]

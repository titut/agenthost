[project]
name = "agenthost"
version = "0.1.0"
description = "A minimal, modular agent host: folder-based agents with tools, skills, and memory."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "pykeepass>=4.1.0",
    "textual>=0.52.0",
    "pyperclip>=1.8.0",
    "apscheduler>=3.10.0",
    # Document/spreadsheet processing used by built-in filesystem tools.
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
# Web research agent.
researcher = [
    "ddgs>=9.0",
    "crawl4ai>=0.9.0",
]

# LinkedIn Jobs scraper.
jobhunter = [
    "playwright>=1.49.0",
]

# Gmail agent.
gmail = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
]

# Background memory curator.
memory = [
    "numpy>=1.24.0",
]

# Everything.
full = [
    "ddgs>=9.0",
    "crawl4ai>=0.9.0",
    "playwright>=1.49.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "numpy>=1.24.0",
]

[project.scripts]
agenthost = "agenthost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenthost"]

# Event schedule for this agent.
# The host automatically sends the prompt to the agent on the defined schedule.
#
# Supported schedule types: daily, weekdays, weekends, monday..sunday,
#                           interval, once
#
# fresh (default: true): When true, the event thread's conversation history is
#   cleared before each run. This prevents repeating events from degrading
#   over time due to accumulating self-referential context. Set to false when
#   the event needs to retain state across runs (e.g. tracking changes over
#   time).
#
# thread_id: Override the auto-generated thread ID to share context with an
#   ongoing conversation (e.g. a Discord channel). When set, fresh behavior
#   still applies - it clears that specific thread.
#
# timezone: "America/New_York"   # sets default timezone for all events
# timezone: "UTC"

timezone: UTC
events:
  - name: interval_example
    enabled: false
    schedule:
      type: interval
      every: 30
      unit: minutes
    fresh: true
    prompt: >
      Runs every 30 minutes. Use interval for recurring background work.

  - name: once_example
    enabled: false
    schedule:
      type: once
      at: "2026-07-07T09:00:00"
    fresh: true
    prompt: >
      Runs once at the specified UTC datetime.

  - name: daily_example
    enabled: false
    schedule:
      type: daily
      time: "09:00"
    fresh: true
    prompt: >
      Runs every day at 09:00 UTC.

  - name: weekdays_example
    enabled: false
    schedule:
      type: weekdays
      time: "09:00"
    fresh: true
    prompt: >
      Runs Monday through Friday at 09:00 UTC.

  - name: weekends_example
    enabled: false
    schedule:
      type: weekends
      time: "10:00"
    fresh: true
    prompt: >
      Runs Saturday and Sunday at 10:00 UTC.

  - name: specific_day_example
    enabled: false
    schedule:
      type: monday
      time: "09:00"
    fresh: true
    prompt: >
      Runs every Monday at 09:00 UTC. Also valid: tuesday, wednesday, thursday,
      friday, saturday, sunday.

  - name: multiple_times_example
    enabled: false
    schedule:
      type: daily
      time:
        - "09:00"
        - "17:00"
    fresh: true
    prompt: >
      Runs every day at both 09:00 and 17:00 UTC.